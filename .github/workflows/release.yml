name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux-windows:
    name: Build Linux & Windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Binaries
        run: |
          mkdir -p dist
          # Windows 64-bit
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/lunaris-windows-amd64.exe ./cmd/lunaris
          # Linux 64-bit
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/lunaris-linux-amd64 ./cmd/lunaris
          chmod +x dist/lunaris-*

      - name: Package Linux (.deb and .tar.gz)
        run: |
          # 1. Debian / Ubuntu / Mint .deb Package
          mkdir -p dist/lunaris-deb/DEBIAN
          mkdir -p dist/lunaris-deb/usr/bin
          mkdir -p dist/lunaris-deb/usr/share/applications
          mkdir -p dist/lunaris-deb/usr/share/icons/hicolor/512x512/apps
          cp dist/lunaris-linux-amd64 dist/lunaris-deb/usr/bin/lunaris
          chmod 755 dist/lunaris-deb/usr/bin/lunaris
          cp assets/lunaris.png dist/lunaris-deb/usr/share/icons/hicolor/512x512/apps/lunaris.png
          chmod 644 dist/lunaris-deb/usr/share/icons/hicolor/512x512/apps/lunaris.png
          printf '[Desktop Entry]\nName=Lunaris\nGenericName=Minecraft Modpack Synchronizer\nComment=Automatic modpack synchronizer and launch wrapper for Minecraft\nExec=/usr/bin/lunaris gui\nIcon=lunaris\nTerminal=false\nType=Application\nCategories=Game;Utility;\nKeywords=minecraft;modpack;curseforge;sync;\nStartupNotify=true\n' > dist/lunaris-deb/usr/share/applications/lunaris.desktop
          chmod 644 dist/lunaris-deb/usr/share/applications/lunaris.desktop
          VERSION_NUM="${GITHUB_REF_NAME#v}"
          printf "Package: lunaris\nVersion: ${VERSION_NUM}\nSection: games\nPriority: optional\nArchitecture: amd64\nMaintainer: Jack Frederick <j49fkk@gmail.com>\nDescription: Lunaris Modpack Auto-Synchronizer & Launch Interceptor\n Lunaris is a zero-dependency synchronization engine and pre-launch interceptor\n designed to sit directly between CurseForge / Minecraft launchers and Minecraft.\n" > dist/lunaris-deb/DEBIAN/control
          dpkg-deb --root-owner-group --build dist/lunaris-deb "dist/lunaris_${VERSION_NUM}_amd64.deb"
          rm -rf dist/lunaris-deb

          # 2. Portable Linux .tar.gz Bundle
          mkdir -p dist/lunaris-tar
          cp dist/lunaris-linux-amd64 dist/lunaris-tar/lunaris
          chmod 755 dist/lunaris-tar/lunaris
          cp assets/lunaris.png dist/lunaris-tar/lunaris.png
          printf '[Desktop Entry]\nName=Lunaris\nComment=Minecraft Modpack Synchronizer\nExec=./lunaris gui\nIcon=./lunaris.png\nTerminal=false\nType=Application\nCategories=Game;Utility;\n' > dist/lunaris-tar/Lunaris.desktop
          chmod 755 dist/lunaris-tar/Lunaris.desktop
          printf '#!/bin/bash\ncd "$$(dirname "$$0")"\necho "Starting Lunaris Installer..."\nchmod +x lunaris 2>/dev/null || true\nif [ "$$1" = "--install" ]; then\n  mkdir -p ~/.local/bin ~/.local/share/applications ~/.local/share/icons/hicolor/512x512/apps\n  cp lunaris ~/.local/bin/lunaris\n  cp lunaris.png ~/.local/share/icons/hicolor/512x512/apps/lunaris.png\n  cat << "EOF" > ~/.local/share/applications/lunaris.desktop\n[Desktop Entry]\nName=Lunaris\nComment=Minecraft Modpack Synchronizer\nExec=$$HOME/.local/bin/lunaris gui\nIcon=lunaris\nTerminal=false\nType=Application\nCategories=Game;Utility;\nEOF\n  echo "Lunaris installed to ~/.local/bin/lunaris and added to desktop applications."\nfi\n./lunaris gui\n' > dist/lunaris-tar/install.sh
          chmod +x dist/lunaris-tar/install.sh
          (cd dist/lunaris-tar && tar -czf ../Lunaris-Linux-x86_64.tar.gz *)
          rm -rf dist/lunaris-tar

      - name: Publish Linux & Windows Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lunaris-windows-amd64.exe
            dist/lunaris-linux-amd64
            dist/lunaris_*_amd64.deb
            dist/Lunaris-Linux-x86_64.tar.gz
          generate_release_notes: true

  build-macos:
    name: Build macOS DMG & App Bundles
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build macOS Universal App Bundle & DMG
        run: |
          mkdir -p dist
          VERSION_NUM="${GITHUB_REF_NAME#v}"

          # Compile Apple Silicon & Intel
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/lunaris-darwin-arm64 ./cmd/lunaris
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/lunaris-darwin-amd64 ./cmd/lunaris
          
          # Create Universal Binary (runs on both Apple Silicon and Intel Macs)
          lipo -create -output dist/lunaris-universal dist/lunaris-darwin-arm64 dist/lunaris-darwin-amd64
          chmod +x dist/lunaris-*

          # Build Universal Lunaris.app Bundle
          mkdir -p dist/Lunaris.app/Contents/MacOS
          mkdir -p dist/Lunaris.app/Contents/Resources
          cp dist/lunaris-universal dist/Lunaris.app/Contents/MacOS/lunaris
          chmod 755 dist/Lunaris.app/Contents/MacOS/lunaris
          cp assets/AppIcon.icns dist/Lunaris.app/Contents/Resources/AppIcon.icns

          cat << EOF > dist/Lunaris.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>lunaris</string>
              <key>CFBundleIconFile</key><string>AppIcon</string>
              <key>CFBundleIdentifier</key><string>com.engineeringjack.lunaris</string>
              <key>CFBundleName</key><string>Lunaris</string>
              <key>CFBundleDisplayName</key><string>Lunaris</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>${VERSION_NUM}</string>
              <key>CFBundleVersion</key><string>${VERSION_NUM}</string>
              <key>LSMinimumSystemVersion</key><string>10.15</string>
              <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF

          # 6. Ad-hoc code sign the executable, bundle, and verify
          xattr -cr dist/Lunaris.app
          codesign --force --sign - dist/Lunaris.app/Contents/MacOS/lunaris
          codesign --force --deep --sign - dist/Lunaris.app
          echo "Verifying code signature:"
          codesign --verify --deep --strict --verbose=2 dist/Lunaris.app

          # 7. Create Universal ZIP archive (preserving symlinks and permissions)
          (cd dist && zip -r -y Lunaris-macOS.zip Lunaris.app)
          cp dist/Lunaris-macOS.zip dist/Lunaris-macOS-AppleSilicon.zip
          cp dist/Lunaris-macOS.zip dist/Lunaris-macOS-Intel.zip

          # 8. Prepare DMG staging directory
          mkdir -p dist/dmg_staging
          cp -R dist/Lunaris.app dist/dmg_staging/
          ln -s /Applications dist/dmg_staging/Applications

          cat << 'EOF' > dist/dmg_staging/Open-Lunaris.command
          #!/bin/bash
          cd "$(dirname "$0")"
          echo "Starting Lunaris..."
          xattr -cr Lunaris.app 2>/dev/null || true
          chmod +x Lunaris.app/Contents/MacOS/lunaris 2>/dev/null || true
          open Lunaris.app
          EOF
          chmod +x dist/dmg_staging/Open-Lunaris.command

          # 9. Create native macOS Disk Image (.dmg) and ad-hoc sign it
          hdiutil create -volname "Lunaris" -srcfolder dist/dmg_staging -ov -format UDZO dist/Lunaris-macOS.dmg
          codesign --force --sign - dist/Lunaris-macOS.dmg
          rm -rf dist/dmg_staging

      - name: Publish macOS Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lunaris-darwin-arm64
            dist/lunaris-darwin-amd64
            dist/Lunaris-macOS.dmg
            dist/Lunaris-macOS.zip
            dist/Lunaris-macOS-AppleSilicon.zip
            dist/Lunaris-macOS-Intel.zip
